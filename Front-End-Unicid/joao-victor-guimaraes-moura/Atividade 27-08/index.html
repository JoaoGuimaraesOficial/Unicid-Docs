<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicío 2</title>
</head>

<body>
    <h2>Campos input text</h2>
    <form action="/action_page.php" method="post"> <!-- apenas exemplo -->
        <label for="first-name">Primeiro nome:</label><br>
        <input type="text" id="first-name" name="first-name"><br>
        <label for="second-name">Sobrenome:</label><br>
        <input type="text" id="second-name" name="second-name"><br><br>
        <input type="submit" value="Registrar"> <br> <br>

        <label for="male">Masculino</label>
        <input type="radio" id="male" name="gender" value="male"></input><br>
        <label for="female">Feminino</label>
        <input type="radio" id="female" name="gender" value="female"></input><br>
        <label for="others">Outro</label>
        <input type="radio" id="others" name="gender" value="others"></input><br><br>

        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label for="vehicle1"> Eu tenho uma bicicleta</label><br>
        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2"> Eu tenho um carro</label><br>
        <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label for="vehicle3"> Eu tenho um barco</label><br><br>
        <input type="submit" value="Enviar"><br><br>

        <label for="phone">Telefone:</label><br>
        <input type="tel" id="phone" name="phone"
            placeholder="(11) 99999-9999"
            title="Use o formato (11) 99999-9999"><br>
        <small>Formato: (NN) NNNNN-NNNN</small><br><br>

        <label for="data-nascimento">Data de nascimento:</label>
        <input type="date" id="data-nascimento" name="data_nascimento">
        </form> 
        <p>Em controles text, o atributo size tem valor padrão 20 quando aplicável; CSS pode alterar a largura visual.</p>
</body>

</html>
