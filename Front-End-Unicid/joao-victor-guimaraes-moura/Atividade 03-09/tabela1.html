<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-Tabela1</title>
</head>

<style>
    table, tr, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        text-align: center;
    }

    th, td {
        padding: 5px;
    }

    table {
        width: 50%;
        border-spacing: 10px;
    }

    th {
        background-color: rgb(90, 2, 200);
        color: white;
    }
</style>

<body>
    <h2>Tabelas em html</h2>
    <table>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>José</td>
            <td>19</td>
            <td>São Paulo - TO</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>23</td>
            <td>Guarulhos - SP</td>
        </tr>
    </table>
</body>

</html>
